# =============================================================================
# Edge-search CI: tests, image build, and on main the GHCR image
# =============================================================================
# bots/edge-search is Python, so rust.yml skips it. A pull request runs the tests
# and builds the image; a push to main also publishes
# ghcr.io/nuniesmith/fks-bot-edge-search (:latest and :sha-<commit>), the name the
# spawner's image allowlist admits (ghcr.io/nuniesmith/fks-bot-*).
# =============================================================================
name: 🔬 Edge search
on:
    pull_request:
        paths:
            - "bots/edge-search/**"
            - ".github/workflows/edge-search.yml"
    push:
        branches: [main]
        paths:
            - "bots/edge-search/**"
            - ".github/workflows/edge-search.yml"

concurrency:
    group: edge-search-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: 🧪 pytest
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install
              run: pip install -r bots/edge-search/requirements.txt -r bots/edge-search/requirements-dev.txt
            - name: Test
              run: python -m pytest bots/edge-search/tests -q

    image:
        name: 🐳 image
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - name: Log in to GHCR
              if: github.event_name == 'push'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build (and on main, push)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: bots/edge-search/Dockerfile
                  push: ${{ github.event_name == 'push' }}
                  tags: |
                      ghcr.io/nuniesmith/fks-bot-edge-search:latest
                      ghcr.io/nuniesmith/fks-bot-edge-search:sha-${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/nuniesmith/fks-spawner
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.title=fks-bot-edge-search
